async function abrirCarpeta(folderId, folderName) {
    console.log('Abriendo carpeta:', folderName, folderId);

    const { data, error } = await supabaseClient
        .from('songs')
        .select('*')
        .eq('folder_id', folderId)
        .order('title', { ascending: true });

    if (error) {
        console.error('Error al cargar canciones:', error);
        alert('Error al cargar las canciones: ' + error.message);
        return;
    }

    console.log('Canciones encontradas:', data);

    // Crear ventana para mostrar las canciones
    const ventana = document.createElement('div');

    ventana.style.cssText = `
        position: fixed;
        inset: 0;
        background: #0b0b0f;
        color: white;
        z-index: 10000;
        overflow-y: auto;
        padding: 20px;
    `;

    // Encabezado
    const encabezado = document.createElement('div');

    encabezado.style.cssText = `
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 25px;
    `;

    const botonVolver = document.createElement('button');

    botonVolver.textContent = '← Volver';

    botonVolver.style.cssText = `
        background: #292936;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        font-size: 16px;
        cursor: pointer;
    `;

    botonVolver.onclick = () => {
        ventana.remove();
    };

    const tituloCarpeta = document.createElement('h2');

    tituloCarpeta.textContent = folderName;

    tituloCarpeta.style.cssText = `
        margin: 0;
        font-size: 24px;
    `;

    encabezado.appendChild(botonVolver);
    encabezado.appendChild(tituloCarpeta);

    ventana.appendChild(encabezado);

    // Si no hay canciones
    if (!data || data.length === 0) {

        const mensaje = document.createElement('p');

        mensaje.textContent = 'No hay canciones en esta carpeta todavía.';

        mensaje.style.cssText = `
            text-align: center;
            color: #aaa;
            margin-top: 50px;
            font-size: 18px;
        `;

        ventana.appendChild(mensaje);

    } else {

        // Crear lista de canciones
        data.forEach(cancion => {

            const tarjeta = document.createElement('div');

            tarjeta.style.cssText = `
                background: #17171f;
                border: 1px solid #292936;
                border-radius: 14px;
                padding: 18px;
                margin-bottom: 12px;
                cursor: pointer;
            `;

            const titulo = document.createElement('div');

            titulo.style.cssText = `
                font-size: 19px;
                font-weight: bold;
            `;

            tarjeta.appendChild(titulo);

            tarjeta.onclick = () => {
                mostrarCancion(cancion, ventana);
            };

            ventana.appendChild(tarjeta);
        });
    }

    document.body.appendChild(ventana);
}

    // CONTENIDO DE LA CANCIÓN
    const contenido = document.createElement('div');

    // NOTAS
    const notas = [
        'C', 'C#', 'D', 'D#', 'E', 'F',
        'F#', 'G', 'G#', 'A', 'A#', 'B'
    ];


    function transponerAcorde(acorde, semitonos) {

        const match = acorde.match(/^([A-G](?:#|b)?)(.*)$/);

        if (!match) return acorde;

        let nota = match[1];
        const resto = match[2];

        // Convertir bemoles comunes a equivalentes sostenidos
        const equivalencias = {
            'Db': 'C#',
            'Eb': 'D#',
            'Gb': 'F#',
            'Ab': 'G#',
            'Bb': 'A#'
        };

        nota = equivalencias[nota] || nota;

        const posicion = notas.indexOf(nota);

        if (posicion === -1) {
            return acorde;
        }

        let nuevaPosicion =
            (posicion + semitonos) % 12;

        if (nuevaPosicion < 0) {
            nuevaPosicion += 12;
        }

        return notas[nuevaPosicion] + resto;
    }


    function mostrarContenido() {

        contenido.innerHTML = '';

        const lineas = (cancion.content || '').split('\n');

        lineas.forEach(linea => {

            const fila = document.createElement('div');

            fila.style.cssText = `
                margin-bottom: 14px;
                font-family: monospace;
                font-size: 18px;
                line-height: 1.35;
            `;

            const acordeRegex =
                /\[([A-G](?:#|b)?(?:m|maj7|maj|7|sus2|sus4|dim|aug|add9|6|9|11|13)?)\]/g;

            let posicion = 0;
            let resultado = '';
            let coincidencia;

            while ((coincidencia = acordeRegex.exec(linea)) !== null) {

                const textoAntes =
                    linea.substring(posicion, coincidencia.index);

                resultado += textoAntes;

                const acordeOriginal = coincidencia[1];

                const acordeTranspuesto =
                    transponerAcorde(
                        acordeOriginal,
                        tonoActual
                    );

                const bloque = document.createElement('span');

                bloque.style.cssText = `
                    display: inline-flex;
                    flex-direction: column;
                    vertical-align: bottom;
                `;

                const acorde = document.createElement('span');

                acorde.textContent = acordeTranspuesto;

                acorde.style.cssText = `
                    color: #b56cff;
                    font-weight: bold;
                    font-size: 16px;
                    min-height: 20px;
                `;

                const letra = document.createElement('span');

                letra.textContent = '';

                bloque.appendChild(acorde);
                bloque.appendChild(letra);

                fila.appendChild(
                    document.createTextNode(textoAntes)
                );

                fila.appendChild(bloque);

                posicion =
                    coincidencia.index +
                    coincidencia[0].length;
            }

            const resto = linea.substring(posicion);

            if (posicion === 0) {

                fila.textContent = linea;

            } else {

                fila.appendChild(
                    document.createTextNode(resto)
                );
            }

            contenido.appendChild(fila);
        });
    }


    botonMenos.onclick = () => {

        tonoActual--;

        if (tonoActual < -11) {
            tonoActual = -11;
        }

        tono.textContent =
            'Tono: ' +
            (tonoActual > 0 ? '+' : '') +
            tonoActual;

        mostrarContenido();
    };


    botonMas.onclick = () => {

        tonoActual++;

        if (tonoActual > 11) {
            tonoActual = 11;
        }

        tono.textContent =
            'Tono: ' +
            (tonoActual > 0 ? '+' : '') +
            tonoActual;

        mostrarContenido();
    };


    mostrarContenido();
}
